
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <h1>Student Management System</h1>
    <p>Manage student records easily</p>
  </header>

  <main class="container">

    <section class="stats-grid">
      <div class="stat-card">
        <p>Total Students</p>
        <h2 id="totalStudents">0</h2>
      </div>

      <div class="stat-card">
        <p>Total Courses</p>
        <h2 id="totalCourses">0</h2>
      </div>

      <div class="stat-card">
        <p>Search Results</p>
        <h2 id="searchResults">0</h2>
      </div>
    </section>

    <section class="panel" id="formPanel">
      <div class="section-heading">
        <h2 id="formTitle">Add New Student</h2>
        <button type="button" id="cancelEditBtn" hidden>
          Cancel Edit
        </button>
      </div>

      <p id="formMessage" class="message"></p>

      <form id="studentForm">
        <input type="hidden" id="studentId">

        <div class="form-grid">
          <div class="form-field">
            <label for="firstName">First Name *</label>
            <input id="firstName" type="text"
                   placeholder="Enter first name" required>
          </div>

          <div class="form-field">
            <label for="lastName">Last Name *</label>
            <input id="lastName" type="text"
                   placeholder="Enter last name" required>
          </div>

          <div class="form-field">
            <label for="email">Email Address *</label>
            <input id="email" type="email"
                   placeholder="Enter email address" required>
          </div>

          <div class="form-field">
            <label for="phone">Phone Number *</label>
            <input id="phone" type="tel"
                   placeholder="Enter phone number"
                   pattern="[0-9+() -]{7,15}" required>
          </div>

          <div class="form-field">
            <label for="dob">Date of Birth *</label>
            <input id="dob" type="date" required>
          </div>

          <div class="form-field">
            <label for="gender">Gender *</label>
            <select id="gender" required>
              <option value="">Select gender</option>
              <option value="Female">Female</option>
              <option value="Male">Male</option>
              <option value="Other">Other</option>
              <option value="Prefer not to say">Prefer not to say</option>
            </select>
          </div>

          <div class="form-field">
            <label for="course">Course *</label>
            <input id="course" type="text"
                   placeholder="Enter course name" required>
          </div>

          <div class="form-field full-width">
            <label for="address">Address *</label>
            <textarea id="address" rows="3"
                      placeholder="Enter full address"
                      required></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submitBtn" class="primary-btn">
            Add Student
          </button>
          <button type="reset" id="resetBtn" class="secondary-btn">
            Clear Form
          </button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="list-heading">
        <div>
          <h2>Student Records</h2>
          <p>View and manage all student information.</p>
        </div>

        <input id="searchInput" type="search"
               placeholder="Search name or email...">
      </div>

      <p id="listMessage" class="message"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Student Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Course</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="studentsTableBody">
            <tr>
              <td colspan="5">Loading students...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <dialog id="detailsDialog">
    <div class="dialog-heading">
      <h2>Student Details</h2>
      <button type="button" id="closeDetailsBtn">Close</button>
    </div>
    <div id="detailsContent"></div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
